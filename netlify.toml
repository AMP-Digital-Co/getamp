[build]
  publish = "."

# Security headers (added 2026-10-14, approved by Bret). Netlify already sends HSTS.
# CSP notes:
#   - script-src needs 'unsafe-inline' for the onerror="" handlers on index.html and the
#     <base> shim in 404.html; drop it when those move into main.js.
#   - style-src needs 'unsafe-inline' for the three style="" attributes on index.html.
#   - fonts.googleapis.com / fonts.gstatic.com go away once Inter is self-hosted (dev ticket 2/3).
#   - frame-src covers the YouTube and Vimeo embeds on the case-study pages.
#   - connect-src 'self' is for the Netlify Forms POST from main.js.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self'; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com; form-action 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
